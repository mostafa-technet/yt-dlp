name: rendered webpage capture

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Webpage URL"
        required: true
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture rendered page
        run: |
          mkdir -p output
          cat > capture.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const url = process.env.TARGET_URL;
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 2200 } });

            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.screenshot({ path: 'output/page.png', fullPage: true });
            await page.pdf({ path: 'output/page.pdf', format: 'A4', printBackground: true }).catch(() => {});
            const html = await page.content();
            fs.writeFileSync('output/rendered.html', html);

            await browser.close();
          })();
          EOF

          TARGET_URL="${{ inputs.url }}" node capture.js

      - name: Commit rendered site to repository
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          git config user.name "rendered-downloader"
          git config user.email "bot@local"
      
          TARGET_BRANCH="rendered-pages"
      
          git checkout -B "$TARGET_BRANCH"
      
          mkdir -p downloads
          mv rendered_site.zip downloads/
      
          git add downloads/rendered_site.zip
      
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
      
          git commit -m "Add rendered page $(date -u '+%Y-%m-%d %H:%M')"
      
          git remote set-url origin \
            https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
      
          git push origin HEAD:$TARGET_BRANCH --force
  
          with:
            name: rendered-page
            path: output/
