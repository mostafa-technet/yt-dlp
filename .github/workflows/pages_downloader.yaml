name: capture rendered page (cookies supported)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to capture"
        required: true
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest

    env:
      MY_CURRENT_SITE_COOKIE: ${{ secrets.MY_CURRENT_SITE_COOKIE }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create capture script
        run: |
          cat << 'EOF' > capture.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          function parseNetscapeCookies(txt) {
            const lines = txt.split(/\r?\n/);
            const cookies = [];

            for (const rawLine of lines) {
              let line = rawLine.trim();
              if (!line) continue;
              if (line === '# Netscape HTTP Cookie File') continue;

              let httpOnly = false;

              if (line.startsWith('#HttpOnly_')) {
                httpOnly = true;
                line = line.replace('#HttpOnly_', '');
              } else if (line.startsWith('#')) {
                continue;
              }

              const parts = line.split('\t');
              if (parts.length < 7) continue;

              const [domain, , path, secureFlag, expires, name, value] = parts;

              cookies.push({
                domain,
                path: path || '/',
                name,
                value,
                secure: secureFlag.toUpperCase() === 'TRUE',
                httpOnly,
                expires: Number(expires) > 0 ? Number(expires) : -1
              });
            }

            return cookies;
          }

          (async () => {

            const url = process.env.TARGET_URL;
            const rawCookieText = process.env.MY_CURRENT_SITE_COOKIE;

            let cookies;

            if (rawCookieText.trim().startsWith('[')) {
              cookies = JSON.parse(rawCookieText);
            } else {
              cookies = parseNetscapeCookies(rawCookieText);
            }

            console.log("Loaded cookies:", cookies.length);

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              viewport: { width: 1400, height: 2000 }
            });

            await context.addCookies(cookies);

            const page = await context.newPage();

            console.log("Opening:", url);

            await page.goto(url, {
              waitUntil: "networkidle",
              timeout: 120000
            });

            await page.waitForTimeout(5000);

            fs.mkdirSync("output", { recursive: true });

            await page.screenshot({
              path: "output/page.png",
              fullPage: true
            });

          

            const html = await page.content();
            fs.writeFileSync("output/rendered.html", html);

            await browser.close();

            console.log("Capture finished");

          })();
          EOF

      - name: Run capture
        run: |
          TARGET_URL="${{ inputs.url }}" node capture.js

      - name: Create zip
        run: |
          cd output
          zip -r ../rendered_site.zip .
          cd ..

      - name: Push result to repo
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          git config user.name "render-bot"
          git config user.email "bot@local"

          TARGET_BRANCH="rendered-pages"

          git checkout -B "$TARGET_BRANCH"

          mkdir -p downloads
          mv rendered_site.zip downloads/

          git add downloads/rendered_site.zip

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Rendered page $(date -u '+%Y-%m-%d %H:%M UTC')"

          git remote set-url origin \
          https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          git push origin HEAD:$TARGET_BRANCH --force
