name: capture rendered page (with cookies)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to capture"
        required: true
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest

    env:
      MY_CURRENT_SITE_COOKIE: ${{ secrets.MY_CURRENT_SITE_COOKIE }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create capture script
        run: |
          cat << 'EOF' > capture.js
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {

            const url = process.env.TARGET_URL;

            console.log("Opening:", url);

            const cookies = JSON.parse(process.env.MY_CURRENT_SITE_COOKIE);

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              viewport: { width: 1400, height: 2000 }
            });

            await context.addCookies(cookies);

            const page = await context.newPage();

            await page.goto(url, {
              waitUntil: "networkidle",
              timeout: 120000
            });

            await page.waitForTimeout(5000);

            if (!fs.existsSync("output")) {
              fs.mkdirSync("output");
            }

            await page.screenshot({
              path: "output/page.png",
              fullPage: true
            });

            try {
              await page.pdf({
                path: "output/page.pdf",
                format: "A4",
                printBackground: true
              });
            } catch (e) {
              console.log("PDF generation skipped");
            }

            const html = await page.content();
            fs.writeFileSync("output/rendered.html", html);

            await browser.close();

            console.log("Capture complete");

          })();
          EOF

      - name: Run capture
        run: |
          TARGET_URL="${{ inputs.url }}" node capture.js

      - name: Create zip
        run: |
          cd output
          zip -r ../rendered_site.zip .
          cd ..

      - name: Push result to repository
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          git config user.name "render-bot"
          git config user.email "bot@local"

          TARGET_BRANCH="rendered-pages"

          git checkout -B "$TARGET_BRANCH"

          mkdir -p downloads
          mv rendered_site.zip downloads/

          git add downloads/rendered_site.zip

          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Rendered page capture $(date -u '+%Y-%m-%d %H:%M UTC')"

          git remote set-url origin \
          https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          git push origin HEAD:$TARGET_BRANCH --force
