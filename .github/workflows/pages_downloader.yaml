name: capture rendered page (cookies supported)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to capture"
        required: true
        type: string

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      YT_GOOGLE_CK: ${{ secrets.YT_GOOGLE_CK }}
      YT_TITLE: "My Automated Upload"
      YT_VISIBILITY: "unlisted"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run upload script
        run: python upload.py

      # (Optional) If you still want to zip/push, you can keep your Git steps here,
      # but ensure the script output is moved to the expected directory.
