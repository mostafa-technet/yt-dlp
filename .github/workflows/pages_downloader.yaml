- name: Download page (HTML + assets only)
  run: |
    URL="${{ inputs.url }}"
    DOMAIN=$(echo "$URL" | awk -F/ '{print $3}')

    mkdir -p site

    wget \
      --page-requisites \
      --convert-links \
      --adjust-extension \
      --span-hosts \
      --no-parent \
      --level=1 \
      --domains="$DOMAIN" \
      --user-agent="Mozilla/5.0 (X11; Linux x86_64)" \
      --timeout=20 \
      --tries=2 \
      --directory-prefix=site \
      "$URL" || true

    echo "Downloaded files:"
    find site | head -100
