name: capture rendered page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to capture"
        required: true
        type: string

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run capture script
        env:
          TARGET_URL: ${{ inputs.url }}
        run: python capture.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f output/
          git commit -m "Add capture results for ${{ inputs.url }}" || echo "No changes to commit"
          git push
