name: fast webpage downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Webpage URL"
        required: true
        type: string

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install wget
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git

      - name: Download single page with assets
        run: |
          URL="${{ inputs.url }}"
          DOMAIN=$(echo "$URL" | awk -F/ '{print $3}')

          mkdir -p site

          wget \
          --page-requisites \
          --convert-links \
          --adjust-extension \
          --span-hosts \
          --no-parent \
          --level=1 \
          --domains="$DOMAIN" \
          --execute robots=off \
          --mirror \
          --no-host-directories \
          --cut-dirs=0 \
          --user-agent="Mozilla/5.0 (X11; Linux x86_64)" \
          --timeout=20 \
          --tries=2 \
          --directory-prefix=site \
          "$URL"


          echo "Downloaded files:"
          find site | head -100

      - name: Configure git
        run: |
          git config user.name "webpage-downloader-bot"
          git config user.email "bot@local"

      - name: Commit files
        run: |
          TARGET_BRANCH="downloaded-pages"

          git checkout -B "$TARGET_BRANCH"

          git add site/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Downloaded webpage $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Push to GitHub
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          git remote set-url origin \
          https://x-access-token:${REPO_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          git push origin HEAD:downloaded-pages --force
