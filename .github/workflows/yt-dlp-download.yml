name: yt-dlp download and push

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download'
        required: true
        type: string

jobs:
  download_and_push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: master

    - name: Setup Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install yt-dlp
      run: |
        python3 -m pip install --upgrade pip
        pip install yt-dlp

    - name: Download using yt-dlp
      env:
        YT_COOKIES: ${{ secrets.YT_COOKIES }}
      run: |
        yt-dlp \
          --no-part \
          --force-overwrites \
          --retries 5 \
          --socket-timeout 30 \
          --retry-sleep 5 \
          --ffmpeg-location /usr/bin/ffmpeg \
          --cookies-from-browser chrome \
          --cookies ./ytcookies.txt \
          "${{ github.event.inputs.url }}"

    - name: Prepare ytcookies.txt
      run: echo "$YT_COOKIES" > ytcookies.txt

    - name: Commit and push downloads
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Add downloaded media from ${{ github.event.inputs.url }}" || echo "No changes to commit"
        git push origin HEAD:yt-dlp-downloads
