name: yt-dlp download and release

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "YouTube URLs separated by spaces or commas"
        required: true
        type: string
      mode:
        description: "Download mode"
        required: true
        default: audio
        type: choice
        options:
          - audio
          - video

jobs:
  ytdlp:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git
          python -m pip install --upgrade pip
          pip install -U yt-dlp

      - name: Write cookies
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt

          if [ ! -s cookies.txt ]; then
            echo "YT_COOKIES secret is empty"
            exit 1
          fi

      - name: Parse URLs
        shell: bash
        run: |
          INPUT="${{ inputs.urls }}"

          printf '%s\n' "$INPUT" \
            | tr ',' '\n' \
            | tr ' ' '\n' \
            | sed '/^$/d' \
            | sort -u > urls.txt

          echo "URLs to process:"
          cat urls.txt

      - name: Download media
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p downloads
          mkdir -p failed

          NODE_EXE=$(which node)

          SUCCESS_COUNT=0
          FAIL_COUNT=0

          while IFS= read -r url || [ -n "$url" ]; do
            url=$(echo "$url" | xargs)

            [ -z "$url" ] && continue

            echo
            echo "========================================"
            echo "Downloading: $url"
            echo "Mode: $MODE"
            echo "========================================"

            if [ "$MODE" = "audio" ]; then

              yt-dlp \
                --cookies cookies.txt \
                --js-runtimes "node:$NODE_EXE" \
                --remote-components ejs:github \
                --download-archive downloads/archive.txt \
                --restrict-filenames \
                --ignore-errors \
                --continue \
                --no-overwrites \
                --extract-audio \
                --audio-format mp3 \
                --audio-quality 0 \
                -f "bestaudio/best" \
                -o "downloads/audio/%(uploader)s/%(title).200s [%(id)s].%(ext)s" \
                "$url"

            else

              yt-dlp \
                --cookies cookies.txt \
                --js-runtimes "node:$NODE_EXE" \
                --remote-components ejs:github \
                --download-archive downloads/archive.txt \
                --restrict-filenames \
                --ignore-errors \
                --continue \
                --no-overwrites \
                --merge-output-format mp4 \
                -f "bv*+ba/b" \
                -o "downloads/video/%(uploader)s/%(title).200s [%(id)s].%(ext)s" \
                "$url"

            fi

            if [ $? -eq 0 ]; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              echo "SUCCESS: $url"
            else
              echo "$url" >> failed/failed_urls.txt
              FAIL_COUNT=$((FAIL_COUNT + 1))
              echo "FAILED: $url"
            fi

          done < urls.txt

          echo
          echo "========================================"
          echo "Download summary"
          echo "========================================"
          echo "Successful: $SUCCESS_COUNT"
          echo "Failed:     $FAIL_COUNT"

      - name: Show downloaded files
        shell: bash
        run: |
          echo "Downloaded files:"

          if find downloads -type f \
              ! -name "archive.txt" \
              -print -quit | grep -q .; then

            find downloads -type f \
              ! -name "archive.txt" \
              -print

          else
            echo "No downloaded files found."
          fi

      - name: Create GitHub Release
      if: success()
      shell: bash
      env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode }}
      run: |
                TAG="yt-dlp-${MODE}-${GITHUB_RUN_ID}"
                TITLE="yt-dlp ${MODE} download #${GITHUB_RUN_NUMBER}"
      
                echo "Release tag: $TAG"
                echo "Release title: $TITLE"
      
                mapfile -t FILES < <(
                  find downloads -type f \
                    ! -name "archive.txt" \
                    -print
                )
      
                if [ "${#FILES[@]}" -eq 0 ]; then
                  echo "No downloaded files were produced."
                  exit 1
                fi
      
                echo
                echo "Files to upload:"
                printf '  %s\n' "${FILES[@]}"
      
                NOTES="Downloaded by yt-dlp GitHub Actions workflow.
      
                Mode: ${MODE}
                Workflow run: ${GITHUB_RUN_ID}
                Workflow run number: ${GITHUB_RUN_NUMBER}
                Downloaded files: ${#FILES[@]}"
      
                # Build the gh command as an array.
                # This is important because filenames can contain spaces,
                # brackets, parentheses, etc.
                GH_ARGS=(
                  release
                  create
                  "$TAG"
                  --repo
                  "$GITHUB_REPOSITORY"
                  --title
                  "$TITLE"
                  --notes
                  "$NOTES"
                )
      
                # Add every downloaded file as a separate, quoted argument.
                for file in "${FILES[@]}"; do
                  GH_ARGS+=("$file")
                done
      
                echo
                echo "Creating GitHub Release..."
      
                gh "${GH_ARGS[@]}"
                - name: Upload failed URL list
                if: always()
                shell: bash
                env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                MODE: ${{ inputs.mode }}
                  run: |
                if [ ! -f failed/failed_urls.txt ]; then
                  echo "No failed URLs file."
                  exit 0
                fi
      
                if [ ! -s failed/failed_urls.txt ]; then
                  echo "Failed URL file is empty."
                  exit 0
                fi
      
                TAG="yt-dlp-${MODE}-${GITHUB_RUN_ID}"
      
                echo "Uploading failed_urls.txt to release $TAG"
      
                gh release upload "$TAG" \
                  failed/failed_urls.txt \
                  --repo "$GITHUB_REPOSITORY"
