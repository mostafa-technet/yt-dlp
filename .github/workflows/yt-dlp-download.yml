name: yt-dlp download and push

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated list of URLs to download'
        required: true
        type: string
      mode:
        description: 'Download mode: video or audio'
        required: true
        default: video
        type: choice
        options:
          - video
          - audio

jobs:
  download_and_push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: master

    - name: Setup Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install yt-dlp
      run: |
        python3 -m pip install --upgrade pip
        pip install yt-dlp

    - name: Prepare ytcookies.txt
      env:
        YT_COOKIES: ${{ secrets.YT_COOKIES }}
      run: echo "$YT_COOKIES" > ytcookies.txt

    - name: Debug Inputs
      run: |
        echo "Received URLs: ${{ github.event.inputs.urls }}"
        echo "Download mode: ${{ github.event.inputs.mode }}"

    - name: Download using yt-dlp for each URL
      run: |
        IFS=',' read -ra URL_ARRAY <<< "${{ github.event.inputs.urls }}"
        
        for url in "${URL_ARRAY[@]}"; do
          trimmed_url=$(echo "$url" | xargs) # trim whitespace
          echo "Downloading: $trimmed_url"

          if [ "${{ github.event.inputs.mode }}" = "audio" ]; then
            yt-dlp -f bestaudio \
              --no-part \
              --force-overwrites \
              --retries 5 \
              --socket-timeout 30 \
              --retry-sleep 5 \
              --ffmpeg-location /usr/bin/ffmpeg \
              --cookies ./ytcookies.txt \
              "$trimmed_url"
          else
            yt-dlp -f bestvideo+bestaudio/best \
              --no-part \
              --force-overwrites \
              --retries 5 \
              --socket-timeout 30 \
              --retry-sleep 5 \
              --ffmpeg-location /usr/bin/ffmpeg \
              --cookies ./ytcookies.txt \
              "$trimmed_url"
          fi
        done

    - name: Commit and push downloads
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Add downloaded media from URLs: ${{ github.event.inputs.urls }} (${{
          github.event.inputs.mode }})" || echo "No changes to commit"
        git push origin HEAD:yt-dlp-downloads
