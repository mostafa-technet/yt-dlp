name: remote file downloader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct file URLs (space, comma, or newline separated)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git

      - name: Download files
        shell: bash
        run: |
          set +e
          mkdir -p downloads/files
          mkdir -p artifact_uploads
          mkdir -p failed
          mkdir -p manifests

          RAW_INPUT="${{ inputs.file_url }}"

          echo "Raw input:"
          echo "$RAW_INPUT"

          printf "%s\n" "$RAW_INPUT" \
            | tr ',' '\n' \
            | tr ' ' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' > urls.txt

          echo ""
          echo "Parsed URLs:"
          cat urls.txt

          MAX_SIZE=$((100 * 1024 * 1024))
          : > manifests/oversize_files.txt

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue

            FILE_NAME="$(basename "${URL%%\?*}")"

            if [ -z "$FILE_NAME" ] || [ "$FILE_NAME" = "/" ] || [ "$FILE_NAME" = "." ]; then
              FILE_NAME="downloaded_file_$(date +%s)"
            fi

            OUT_FILE="downloads/files/$FILE_NAME"

            echo ""
            echo "Downloading: $URL"

            if curl -L --fail \
              --retry 3 \
              --retry-delay 5 \
              -o "$OUT_FILE" \
              "$URL"; then

              FILE_SIZE=$(stat -c%s "$OUT_FILE")

              if [ "$FILE_SIZE" -ge "$MAX_SIZE" ]; then
                echo "Oversize file moved to artifact storage: $FILE_NAME ($FILE_SIZE bytes)"
                mv "$OUT_FILE" "artifact_uploads/$FILE_NAME"
                echo "$FILE_NAME | $URL | $FILE_SIZE bytes" >> manifests/oversize_files.txt
              fi
            else
              echo "$URL" >> failed/failed.txt
            fi

          done < urls.txt

          echo ""
          echo "GitHub-stored files:"
          find downloads -type f || true

          echo ""
          echo "Artifact files:"
          find artifact_uploads -type f || true

          echo ""
          echo "Oversize manifest:"
          cat manifests/oversize_files.txt 2>/dev/null || echo "None"

          echo ""
          echo "Failed URLs:"
          cat failed/failed.txt 2>/dev/null || echo "None"

      - name: Upload oversized files as artifact
        if: ${{ hashFiles('artifact_uploads/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: remote-downloaded-large-files
          path: artifact_uploads/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure git
        run: |
          git config user.name "file-downloader-bot"
          git config user.email "bot@local"

      - name: Commit files
        shell: bash
        run: |
          TARGET_BRANCH="remote-downloads"

          git checkout -B "$TARGET_BRANCH"

          git add -f downloads/
          git add -f failed/ || true
          git add -f manifests/ || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "remote download $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Push to GitHub
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin remote-downloads
