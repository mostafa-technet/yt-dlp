name: remote file downloader

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "Direct file URLs (space, comma, or newline separated)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git

      - name: Download files
        shell: bash
        run: |
          set +e
          mkdir -p downloads/files
          mkdir -p failed

          RAW_INPUT="${{ inputs.file_url }}"

          echo "Raw input:"
          echo "$RAW_INPUT"

          printf "%s\n" "$RAW_INPUT" \
            | tr ',' '\n' \
            | tr ' ' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | sed '/^$/d' > urls.txt

          echo ""
          echo "Parsed URLs:"
          cat urls.txt

          while IFS= read -r URL; do
            [ -z "$URL" ] && continue

            FILE_NAME="$(basename "${URL%%\?*}")"

            if [ -z "$FILE_NAME" ] || [ "$FILE_NAME" = "/" ] || [ "$FILE_NAME" = "." ]; then
              FILE_NAME="downloaded_file_$(date +%s)"
            fi

            echo ""
            echo "Downloading: $URL"

            curl -L --fail \
              --retry 3 \
              --retry-delay 5 \
              -o "downloads/files/$FILE_NAME" \
              "$URL" || echo "$URL" >> failed/failed.txt

          done < urls.txt

          echo ""
          echo "Downloaded files:"
          find downloads -type f || true

          echo ""
          echo "Failed URLs:"
          cat failed/failed.txt 2>/dev/null || echo "None"

      - name: Configure git
        run: |
          git config user.name "file-downloader-bot"
          git config user.email "bot@local"

      - name: Commit files
        shell: bash
        run: |
          TARGET_BRANCH="remote-downloads"

          git checkout -B "$TARGET_BRANCH"

          git add -f downloads/
          git add -f failed/ || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "remote download $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Push to GitHub
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin remote-downloads
