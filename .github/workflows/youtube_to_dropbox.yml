name: YouTube to Dropbox Uploader

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube Video or Playlist URL"
        required: true
        type: string
      download_mode:
        description: "Download Format"
        required: true
        type: choice
        default: "video"
        options:
          - video
          - audio

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v1
        with:
          with-ffmpeg: true

      - name: Create Cookie File
        run: |
          echo "${{ secrets.YT_GOOGLE_CK }}" > cookies.txt
          if [ ! -s cookies.txt ]; then rm cookies.txt; fi

      - name: Download from YouTube
        id: download
        run: |
          mkdir -p downloads
          
          if [ "${{ inputs.download_mode }}" = "audio" ]; then
            FORMAT_OPTS="-x --audio-format mp3 --audio-quality 0"
          else
            # Prioritizes 480p -> 720p -> 360p -> best fallback
            FORMAT_OPTS="-f (bestvideo[height=480]+bestaudio)/best[height=480]/(bestvideo[height=720]+bestaudio)/best[height=720]/(bestvideo[height=360]+bestaudio)/best[height=360]/best"
          fi

          COOKIE_FLAG=""
          if [ -f cookies.txt ]; then
            echo "Cookies detected. Using authenticated session."
            COOKIE_FLAG="--cookies cookies.txt"
          else
            echo "Warning: No cookies found. This might fail on GitHub runners."
          fi
          
          # Added --js-runtimes node to ensure EJS uses Node.js for signature decryption
          yt-dlp $FORMAT_OPTS $COOKIE_FLAG \
            --js-runtimes node \
            -o "downloads/%(title)s.%(ext)s" \
            --restrict-filenames \
            --no-mtime \
            "${{ inputs.youtube_url }}"

          echo "Download process finished."
          ls -la downloads/

      - name: Upload to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          rm -f cookies.txt

          if [ -z "$(ls -A downloads)" ]; then
            echo "No files to upload."
            exit 1
          fi

          for FILE_PATH in downloads/*; do
            [ -e "$FILE_PATH" ] || continue
            FILE_NAME=$(basename "$FILE_PATH")
            echo "Uploading $FILE_NAME to Dropbox..."

            API_ARG=$(jq -cn \
              --arg path "/YouTube-Downloads/$FILE_NAME" \
              '{path: $path, mode: "add", autorename: true, mute: false, strict_conflict: false}')

            RESPONSE=$(curl -X POST https://content.dropboxapi.com/2/files/upload \
              --write-out "%{http_code}" --silent --output /dev/null \
              -H "Authorization: Bearer $DROPBOX_ACCESS_TOKEN" \
              -H "Dropbox-API-Arg: $API_ARG" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE_PATH")

            if [ "$RESPONSE" -eq 200 ]; then
              echo "Successfully uploaded: $FILE_NAME"
            else
              echo "Failed to upload $FILE_NAME. HTTP status code: $RESPONSE"
              exit 1
            fi
          done
